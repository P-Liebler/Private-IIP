name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare ephemeral local environment
        run: |
          cp .env.example .env
          echo "CODE_COMMIT=$GITHUB_SHA" >> .env
          python3 - <<'PY'
          import base64
          from pathlib import Path
          import secrets
          path = Path('.env')
          key = base64.urlsafe_b64encode(secrets.token_bytes(32)).decode()
          path.write_text(path.read_text().replace('TOTP_ENCRYPTION_KEY=', 'TOTP_ENCRYPTION_KEY=' + key, 1))
          PY
      - name: Validate Compose and start services
        run: |
          docker compose config --quiet
          docker compose up --build -d --wait
          docker compose exec -T api alembic upgrade head
      - name: Backend checks
        run: |
          python3 -m unittest discover -s ops/tests -v
          docker compose exec -T api ruff check .
          docker compose exec -T api ruff format --check .
          docker compose exec -T api mypy app
          docker compose exec -T api pytest -q
          docker compose exec -T api python -m scripts.verify_fresh_migration
      - name: Frontend checks
        run: |
          docker compose stop web
          docker compose run --rm --no-deps web npm run lint
          docker compose run --rm --no-deps web npm run typecheck
          docker compose run --rm --no-deps web npm run build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Prepare explicit synthetic browser fixtures
        run: |
          docker compose exec -T api python -m scripts.create_restore_fixture > "$RUNNER_TEMP/p4-fixture.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads(Path(os.environ['RUNNER_TEMP'], 'p4-fixture.json').read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key, field in [('E2E_USERNAME', 'username'), ('E2E_PORTFOLIO_ID', 'portfolio_id'), ('E2E_RESEARCH_INSTRUMENT_ID', 'instrument_id')]:
                  output.write(f'{key}={value[field]}\n')
          PY
      - name: Prepare P5/P6 fixtures and run browser tests
        env:
          E2E_PASSWORD: test-only-restore-password-2
        run: |
          docker compose exec -T -e E2E_USERNAME -e E2E_RESEARCH_INSTRUMENT_ID api python -m scripts.create_research_fixture > "$RUNNER_TEMP/p5-fixture.json"
          export E2E_MISSING_INSTRUMENT_ID=$(python3 -c 'import json,os; from pathlib import Path; print(json.loads(Path(os.environ["RUNNER_TEMP"], "p5-fixture.json").read_text())["missing_instrument_id"])')
          docker compose exec -T -e E2E_USERNAME api python -m scripts.create_p6_fixture > "$RUNNER_TEMP/p6-fixture.json"
          export E2E_P6_UNIVERSE_ID=$(python3 -c 'import json,os; from pathlib import Path; print(json.loads(Path(os.environ["RUNNER_TEMP"], "p6-fixture.json").read_text())["universe_id"])')
          export E2E_P6_UNVERIFIED_UNIVERSE_ID=$(python3 -c 'import json,os; from pathlib import Path; print(json.loads(Path(os.environ["RUNNER_TEMP"], "p6-fixture.json").read_text())["unverified_universe_id"])')
          export E2E_P6_BENCHMARK_ID=$(python3 -c 'import json,os; from pathlib import Path; print(json.loads(Path(os.environ["RUNNER_TEMP"], "p6-fixture.json").read_text())["benchmark_id"])')
          # Optional assistant uses a deterministic, explicit test-only runtime.
          APP_ENV=test ASSISTANT_TEST_MODE=true DATA_OPERATOR_USERNAMES="[\"$E2E_USERNAME\"]" docker compose up -d --no-deps --wait api worker scheduler
          docker compose exec -T -e E2E_USERNAME -e E2E_RESEARCH_INSTRUMENT_ID api python -m scripts.create_p10_fixture > "$RUNNER_TEMP/p10-fixture.json"
          docker compose -f docker-compose.yml -f ops/docker-compose.e2e.yml up -d --no-deps web
          # Docker creates bind-mount mountpoints as root on Linux. Install the
          # browser runner in a runner-owned directory, never in that mountpoint.
          runner_dir=$(mktemp -d "$RUNNER_TEMP/iip-browser.XXXXXX")
          cp frontend/web/package.json frontend/web/package-lock.json frontend/web/playwright.config.ts "$runner_dir/"
          cp -R frontend/web/e2e "$runner_dir/e2e"
          cd "$runner_dir"
          npm ci
          npx playwright install --with-deps chromium
          browser_result=0
          npm run test:e2e -- --workers=1 > e2e.log 2>&1 || browser_result=$?
          python3 "$GITHUB_WORKSPACE/ops/redact_test_artifacts.py" e2e.log test-results
          cat e2e.log
          exit "$browser_result"
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop services
        if: always()
        run: docker compose down
