apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iip-allow-openshift-router
  annotations:
    argocd.argoproj.io/sync-wave: "-7"
  labels:
    app.kubernetes.io/part-of: investment
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: caddy
      app.kubernetes.io/part-of: investment
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
      ports:
        - protocol: TCP
          port: 8443
