{
  "apiVersion": "kustomize.config.k8s.io/v1beta1",
  "kind": "Kustomization",
  "namespace": "gitops-demo",
  "resources": [
    "build-waiters.json",
    "runtime-preflight.json",
    "s3-bootstrap.json",
    "db-bootstrap-job.json"
  ],
  "configMapGenerator": [
    {
      "name": "iip-first-use-schema",
      "files": [
        "bootstrap.py=bootstrap-schema.py"
      ]
    }
  ],
  "generatorOptions": {
    "disableNameSuffixHash": true,
    "annotations": {
      "argocd.argoproj.io/sync-wave": "-20"
    }
  }
}
